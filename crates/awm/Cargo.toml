[package]
name = "agent-workspace-mover"
description = "Move or rename a workspace folder, and carry everything keyed on its path with it: agent sessions, memory and settings, git's links, and editor state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["claude-code", "git", "workspace", "move", "rename"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agent-workspace-mover"
path = "src/main.rs"

[dependencies]
awm-core.workspace = true
awm-agent-claude.workspace = true
awm-vcs-git.workspace = true
awm-editor-vscode.workspace = true
awm-detectors.workspace = true
clap = { version = "4.6", features = ["derive"] }
schemars = "1.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[dev-dependencies]
assert_cmd = "2.2"
awm-testkit.workspace = true
tempfile.workspace = true
# Only validates the tool's own schemas; no network features (deny.toml bans HTTP clients).
jsonschema = { version = "0.60", default-features = false, features = ["arbitrary-precision"] }

[lints]
workspace = true
